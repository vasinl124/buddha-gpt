<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>buddha-gpt: one chat turn, step by step</title>
  <desc>The browser sends a question to the agent. The agent calls Go over HTTP/JSON; Go embeds the question, runs vector and keyword search in Postgres, merges the rankings and returns 8 passages. The agent sends the prompt, passages and history to the LLM, streams the words to the browser over SSE, checks the citations, and sends trilingual citation cards last.</desc>
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B7280" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1000" height="940" fill="#ffffff"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">One chat turn, step by step</text>

  <!-- legend -->
  <line x1="40" y1="66" x2="80" y2="66" stroke="#374151" stroke-width="2" marker-end="url(#call)"/>
  <text x="90" y="70" font-size="12.5" fill="#374151">a call (the caller waits)</text>
  <line x1="300" y1="66" x2="340" y2="66" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="350" y="70" font-size="12.5" fill="#374151">the answer coming back</text>

  <!-- bands -->
  <rect x="20" y="212" width="960" height="352" rx="12" fill="#EFF8F6"/>
  <rect x="20" y="574" width="960" height="128" rx="12" fill="#F2F6FD"/>
  <rect x="20" y="712" width="960" height="150" rx="12" fill="#F7F5FB"/>

  <!-- lifelines -->
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="110" y1="144" x2="110" y2="865"/>
    <line x1="320" y1="144" x2="320" y2="865"/>
    <line x1="540" y1="144" x2="540" y2="865"/>
    <line x1="740" y1="144" x2="740" y2="865"/>
    <line x1="910" y1="144" x2="910" y2="865"/>
  </g>

  <!-- band labels, drawn over the lifelines -->
  <text x="34" y="232" font-size="11" font-weight="700" letter-spacing="1" fill="#1B6E62" paint-order="stroke" stroke="#EFF8F6" stroke-width="5">RETRIEVAL · THE “R” IN RAG</text>
  <text x="34" y="594" font-size="11" font-weight="700" letter-spacing="1" fill="#3B5B8C" paint-order="stroke" stroke="#F2F6FD" stroke-width="5">GENERATION · THE “G”</text>
  <text x="34" y="732" font-size="11" font-weight="700" letter-spacing="1" fill="#5B4A8C" paint-order="stroke" stroke="#F7F5FB" stroke-width="5">CHECK, THEN SHOW</text>

  <!-- participants -->
  <rect x="35" y="92" width="150" height="52" rx="10" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="1.5"/>
  <text x="110" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Browser</text>
  <text x="110" y="132" text-anchor="middle" font-size="12" fill="#4B5563">Next.js</text>
  <rect x="235" y="92" width="170" height="52" rx="10" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="1.5"/>
  <text x="320" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Agent</text>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="#4B5563">TypeScript</text>
  <rect x="455" y="92" width="170" height="52" rx="10" fill="#E3F5F2" stroke="#1B8A7A" stroke-width="1.5"/>
  <text x="540" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Retrieval API</text>
  <text x="540" y="132" text-anchor="middle" font-size="12" fill="#4B5563">Go</text>
  <rect x="665" y="92" width="150" height="52" rx="10" fill="#F0EBFA" stroke="#6B4FBB" stroke-width="1.5"/>
  <text x="740" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Postgres</text>
  <text x="740" y="132" text-anchor="middle" font-size="12" fill="#4B5563">pgvector</text>
  <rect x="835" y="92" width="150" height="52" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="910" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">OpenRouter</text>
  <text x="910" y="132" text-anchor="middle" font-size="12" fill="#4B5563">embeddings + LLM</text>

  <!-- 1: question -->
  <line x1="110" y1="180" x2="318" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#call)"/>
  <text x="215" y="170" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">1</tspan>  “I lost my father.”</text>

  <!-- retrieval -->
  <line x1="320" y1="255" x2="538" y2="255" stroke="#374151" stroke-width="2" marker-end="url(#call)"/>
  <text x="430" y="245" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">2</tspan>  POST /v1/search · HTTP/JSON</text>

  <line x1="540" y1="305" x2="908" y2="305" stroke="#374151" stroke-width="2" marker-end="url(#call)"/>
  <text x="725" y="295" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">3</tspan>  embed the question (bge-m3)</text>
  <line x1="910" y1="345" x2="542" y2="345" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="725" y="337" text-anchor="middle" font-size="13" fill="#4B5563">a vector: 1,024 numbers</text>

  <line x1="540" y1="395" x2="738" y2="395" stroke="#374151" stroke-width="2" marker-end="url(#call)"/>
  <text x="640" y="385" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">4</tspan>  vector + keyword search</text>
  <line x1="740" y1="435" x2="542" y2="435" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="640" y="427" text-anchor="middle" font-size="13" fill="#4B5563">two ranked lists</text>

  <rect x="440" y="455" width="200" height="40" rx="8" fill="#E3F5F2" stroke="#1B8A7A" stroke-width="1.5"/>
  <text x="540" y="480" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">5</tspan>  merge rankings → top 8</text>

  <line x1="540" y1="535" x2="322" y2="535" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="430" y="527" text-anchor="middle" font-size="13" fill="#4B5563">8 passages, each with an ID</text>

  <!-- generation -->
  <line x1="320" y1="620" x2="908" y2="620" stroke="#374151" stroke-width="2" marker-end="url(#call)"/>
  <text x="615" y="610" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">6</tspan>  prompt + 8 passages + history → LLM</text>
  <line x1="910" y1="660" x2="322" y2="660" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="615" y="652" text-anchor="middle" font-size="13" fill="#4B5563">words stream back, one by one</text>

  <line x1="320" y1="690" x2="112" y2="690" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="215" y="682" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">7</tspan>  streamed words (SSE)</text>

  <!-- check, then show -->
  <rect x="180" y="742" width="340" height="66" rx="8" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="1.5"/>
  <text x="350" y="762" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">8</tspan>  checks, while streaming and at the end:</text>
  <text x="350" y="780" text-anchor="middle" font-size="12.5" fill="#4B5563">held until the route and first citation arrive</text>
  <text x="350" y="797" text-anchor="middle" font-size="12.5" fill="#4B5563">Pali held until it matches · IDs came from Go</text>

  <line x1="320" y1="835" x2="112" y2="835" stroke="#6B7280" stroke-width="1.6" marker-end="url(#reply)"/>
  <text x="215" y="826" text-anchor="middle" font-size="13.5" fill="#1F2937"><tspan font-weight="700">9</tspan>  final: reply + cards (SSE)</text>
  <text x="215" y="853" text-anchor="middle" font-size="12.5" fill="#4B5563">Pali · Thai · English</text>

  <text x="40" y="895" font-size="13" fill="#374151">Tools: search_canon repeats steps 2–5; get_passage is one lookup by ID. Results go back to the model (≤ 4 model steps).</text>
  <text x="40" y="918" font-size="13" fill="#6B7280">Not drawn: the guard, which runs before step 2 and turns follow-ups into standalone queries. History stays in the browser.</text>
</svg>
