<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 1123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>buddha-gpt on Railway · one public domain</title>
<desc>The hosted app on Railway, numbered 1 to 7 to match the table in PRD section 7.4. Only the web service has a public domain: it proxies /agent to the agent over the private network, so the session cookie is first-party. The agent, the core and Postgres are private. The dashed arrow is the one-time load of the canon.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
