name: Claude Code Review

# Reviews every push to a PR. This doesn't use the stock code-review plugin
# because it skips any PR Claude has already commented on, so pushes after
# the first review would go unreviewed.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels the review still running for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A fork's PR gets no secrets, so there's no token to review it with
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Also review the commits Claude pushes when you ask @claude for a fix
          allowed_bots: claude
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            Review this pull request. This runs on every push, so review it even if you have reviewed it before.

            1. Run `gh pr view ${{ github.event.pull_request.number }} --comments` and note every issue listed in earlier comments that start with "Claude code review". Those issues are already raised.
            2. Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Read CLAUDE.md and the surrounding code when you need context.
            3. Find only high-signal issues in the changed code: bugs, wrong logic, security holes, code that won't build or run, and clear CLAUDE.md violations. Skip style nits, pre-existing issues and anything a linter would catch. If you aren't sure an issue is real, leave it out.
            4. Drop every issue that is already raised, even if it is still unfixed: its earlier comment is still on the PR. The issues left are the new ones.
            5. Post each new issue as an inline comment with mcp__github_inline_comment__create_inline_comment and confirmed: true.
            6. Finish with one `gh pr comment` that starts with "Claude code review for <first 7 characters of HEAD COMMIT>" and lists each new issue as `path:line - one sentence`, or says "No new issues found."
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
